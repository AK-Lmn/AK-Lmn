<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <!-- Background Canvas Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="50%" stop-color="#0d0f17"/>
      <stop offset="100%" stop-color="#08090d"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="terminalGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#161922" stroke-width="0.8"/>
      <circle cx="30" cy="30" r="0.7" fill="#222838"/>
    </pattern>

    <!-- Border Gradients -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f2430"/>
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1f2430"/>
      <stop offset="85%" stop-color="#00f2fe" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1f2430"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131622" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0c0e17" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .term-mono { font-family: ui-monospace, "Cascadia Code", "Source Code Pro", Menlo, Consolas, monospace; }
    .term-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
    .title-glitch { font-weight: 900; letter-spacing: 8px; fill: #f8fafc; font-size: 42px; }
    .cyan-accent { fill: #38bdf8; }
    .muted-text { fill: #64748b; font-size: 11px; letter-spacing: 1.5px; }
    .code-dim { fill: #475569; font-size: 11px; }
    .pill-val { fill: #f1f5f9; font-weight: 700; font-size: 15px; }
    .pill-lbl { fill: #94a3b8; font-size: 10px; letter-spacing: 1.5px; }
  </style>

  <!-- Deep Obsidian Canvas -->
  <rect width="1200" height="420" rx="12" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" rx="12" fill="url(#terminalGrid)"/>
  <rect x="1" y="1" width="1198" height="418" rx="12" fill="none" stroke="url(#borderGrad)" stroke-width="1.2"/>

  <!-- Terminal Window Chrome / Top Header Bar -->
  <rect x="1" y="1" width="1198" height="42" rx="12" fill="#0d101a" stroke="#1e2433" stroke-width="1"/>
  <rect x="1" y="30" width="1198" height="13" fill="#0d101a"/>
  
  <!-- Traffic Light Window Controls -->
  <circle cx="28" cy="22" r="5" fill="#ef4444" opacity="0.85"/>
  <circle cx="46" cy="22" r="5" fill="#f59e0b" opacity="0.85"/>
  <circle cx="64" cy="22" r="5" fill="#10b981" opacity="0.85"/>

  <!-- Terminal Title Prompt -->
  <text x="50%" y="26" text-anchor="middle" class="term-mono muted-text">ak-lmn@workstation:~ // ARCHIVAL WORKSTATION v2.6.0</text>
  <text x="1150" y="26" text-anchor="end" class="term-mono code-dim">[STATUS: ONLINE · READY]</text>

  <!-- Inner Ambient Neon Lines -->
  <line x1="40" y1="43" x2="1160" y2="43" stroke="#1e2433" stroke-width="1"/>

  <!-- Left Side: Terminal CLI Session -->
  <g transform="translate(60, 75)">
    <!-- Terminal Command Line 1 -->
    <text x="0" y="20" class="term-mono" font-size="13" fill="#38bdf8">&gt; sys.identity --verbose</text>
    <text x="0" y="44" class="term-mono" font-size="12" fill="#cbd5e1">NAME: Kim Lamano <tspan fill="#64748b">(@AK-Lmn)</tspan></text>
    <text x="0" y="66" class="term-mono" font-size="12" fill="#94a3b8">ROLE: Systems Architect · Runtime Engine &amp; Tooling Developer</text>
    <text x="0" y="88" class="term-mono" font-size="12" fill="#94a3b8">ACADEMICS: 2nd Year B.S. Computer Science @ Lyceum of Alabang</text>

    <!-- Terminal Command Line 2 -->
    <text x="0" y="128" class="term-mono" font-size="13" fill="#38bdf8">&gt; runtime.inspect --core-ecosystem</text>
    <text x="0" y="152" class="term-mono" font-size="12" fill="#e2e8f0">OFFICIAL FLISK MAINTAINER <tspan fill="#38bdf8">[66 Repositories Authorized]</tspan></text>
    <text x="0" y="174" class="term-mono" font-size="12" fill="#64748b">RANK: Founding Contributor #3 of 100 · Flisk Elite · Brown Belt (4-1 kyu)</text>
    <text x="0" y="196" class="term-mono" font-size="12" fill="#64748b">IMPACT: 83 Merged in Core Runtime Engine · 214 Across Open Source</text>
  </g>

  <!-- Right Side: Big ASCII / Monospace Visual Hero -->
  <g transform="translate(730, 80)">
    <!-- Neumorphic Frame -->
    <rect x="0" y="0" width="410" height="200" rx="8" fill="url(#cardGrad)" stroke="#1e2536" stroke-width="1.2"/>
    
    <!-- Header of Sub-box -->
    <rect x="0" y="0" width="410" height="28" rx="8" fill="#111420" stroke="#1e2536" stroke-width="1"/>
    <rect x="0" y="18" width="410" height="10" fill="#111420"/>
    <text x="16" y="19" class="term-mono muted-text">// CORE MATRIX</text>
    <circle cx="390" cy="14" r="3.5" fill="#38bdf8" filter="url(#cyanGlow)"/>

    <!-- Content Inside Frame -->
    <text x="20" y="60" class="term-mono" font-size="12" fill="#64748b">ARCH:</text>
    <text x="80" y="60" class="term-mono" font-size="12" fill="#f8fafc">Offline-First · 3D Spatial Runtimes</text>

    <text x="20" y="88" class="term-mono" font-size="12" fill="#64748b">TOOL:</text>
    <text x="80" y="88" class="term-mono" font-size="12" fill="#f8fafc">Tilt · Traefik · Docker · FastMCP</text>

    <text x="20" y="116" class="term-mono" font-size="12" fill="#64748b">STACK:</text>
    <text x="80" y="116" class="term-mono" font-size="12" fill="#f8fafc">TypeScript · React 19 · Python · Go</text>

    <text x="20" y="144" class="term-mono" font-size="12" fill="#64748b">RECOGN:</text>
    <text x="80" y="144" class="term-mono" font-size="12" fill="#38bdf8">XERJ Corpus Hub (4.2k+ Stars)</text>

    <text x="20" y="176" class="term-mono code-dim">&gt; telemetry: continuous integration active_</text>
  </g>

  <!-- Divider Line -->
  <line x1="40" y1="305" x2="1160" y2="305" stroke="#1a202c" stroke-width="1"/>

  <!-- Bottom Metric Pods (Obsidian Card Tiles) -->
  <g transform="translate(60, 325)">
    <!-- Pod 1: Merged PRs -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="250" height="68" rx="8" fill="url(#cardGrad)" stroke="#1e2536" stroke-width="1"/>
      <text x="20" y="24" class="term-mono pill-lbl">GLOBAL MERGED PRS</text>
      <text x="20" y="52" class="term-mono pill-val cyan-accent">214 <tspan font-size="12" fill="#64748b">COMMITS/PRS</tspan></text>
      <circle cx="225" cy="34" r="4" fill="#38bdf8"/>
    </g>

    <!-- Pod 2: Flisk Core Merged -->
    <g transform="translate(275, 0)">
      <rect x="0" y="0" width="250" height="68" rx="8" fill="url(#cardGrad)" stroke="#1e2536" stroke-width="1"/>
      <text x="20" y="24" class="term-mono pill-lbl">FLISK RUNTIME CORE</text>
      <text x="20" y="52" class="term-mono pill-val" fill="#f8fafc">83 <tspan font-size="12" fill="#64748b">MERGED IN CORE</tspan></text>
      <circle cx="225" cy="34" r="4" fill="#10b981"/>
    </g>

    <!-- Pod 3: Flagship LibriQ -->
    <g transform="translate(550, 0)">
      <rect x="0" y="0" width="250" height="68" rx="8" fill="url(#cardGrad)" stroke="#1e2536" stroke-width="1"/>
      <text x="20" y="24" class="term-mono pill-lbl">FLAGSHIP ARCHITECTURE</text>
      <text x="20" y="52" class="term-mono pill-val" fill="#f8fafc">LIBRIQ <tspan font-size="12" fill="#38bdf8">3D PWA</tspan></text>
      <circle cx="225" cy="34" r="4" fill="#06b6d4"/>
    </g>

    <!-- Pod 4: Ecosystems -->
    <g transform="translate(825, 0)">
      <rect x="0" y="0" width="255" height="68" rx="8" fill="url(#cardGrad)" stroke="#1e2536" stroke-width="1"/>
      <text x="20" y="24" class="term-mono pill-lbl">ORGANIZATIONS &amp; REPOS</text>
      <text x="20" y="52" class="term-mono pill-val" fill="#f8fafc">50+ <tspan font-size="12" fill="#64748b">ECOSYSTEMS</tspan></text>
      <circle cx="230" cy="34" r="4" fill="#8b5cf6"/>
    </g>
  </g>
</svg>
