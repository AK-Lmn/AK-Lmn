<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="nebula1" cx="20%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4c1d95" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#1e1b4b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#05050a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="85%" cy="70%" r="65%">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.75"/>
      <stop offset="55%" stop-color="#164e63" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#05050a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="supernovaCore" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#818cf8" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#9333ea" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#05050a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 900; letter-spacing: 6px; fill: url(#textGrad); }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 500; letter-spacing: 3px; fill: #cbd5e1; font-size: 16px; }
    .meta { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 13px; fill: #22d3ee; letter-spacing: 2px; }
    .ae { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, serif; font-weight: 800; font-style: italic; fill: #38bdf8; opacity: 0.15; }
    .grid { stroke: rgba(148, 163, 184, 0.08); stroke-width: 1; }
  </style>

  <!-- Deep Cosmic Canvas -->
  <rect width="1200" height="360" rx="16" fill="#07080f"/>
  <rect width="1200" height="360" fill="url(#nebula1)"/>
  <rect width="1200" height="360" fill="url(#nebula2)"/>
  <circle cx="600" cy="180" r="280" fill="url(#supernovaCore)"/>

  <!-- Cosmic Grid Overlay -->
  <line x1="0" y1="90" x2="1200" y2="90" class="grid" />
  <line x1="0" y1="180" x2="1200" y2="180" class="grid" />
  <line x1="0" y1="270" x2="1200" y2="270" class="grid" />
  <line x1="200" y1="0" x2="200" y2="360" class="grid" />
  <line x1="400" y1="0" x2="400" y2="360" class="grid" />
  <line x1="600" y1="0" x2="600" y2="360" class="grid" />
  <line x1="800" y1="0" x2="800" y2="360" class="grid" />
  <line x1="1000" y1="0" x2="1000" y2="360" class="grid" />

  <!-- Celestial Stars & Sparkles -->
  <circle cx="120" cy="65" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="280" cy="120" r="1.2" fill="#38bdf8" opacity="0.9"/>
  <circle cx="450" cy="45" r="2" fill="#c084fc" opacity="0.7"/>
  <circle cx="780" cy="80" r="1.5" fill="#f472b6" opacity="0.8"/>
  <circle cx="950" cy="60" r="2.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="1080" cy="140" r="1.2" fill="#38bdf8" opacity="0.7"/>
  <circle cx="150" cy="300" r="2" fill="#38bdf8" opacity="0.8"/>
  <circle cx="380" cy="320" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="720" cy="290" r="1.8" fill="#c084fc" opacity="0.8"/>
  <circle cx="890" cy="310" r="1.2" fill="#38bdf8" opacity="0.7"/>
  <circle cx="1040" cy="280" r="2.2" fill="#ffffff" opacity="0.9"/>

  <!-- Supernova Flash Cross -->
  <g transform="translate(950, 60)" filter="url(#glow)">
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="0" y1="-18" x2="0" y2="18" stroke="#38bdf8" stroke-width="1.5"/>
  </g>
  <g transform="translate(180, 260)" filter="url(#glow)">
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#c084fc" stroke-width="1.2"/>
    <line x1="0" y1="-12" x2="0" y2="12" stroke="#c084fc" stroke-width="1.2"/>
  </g>

  <!-- Big Watermark "æ" Motif -->
  <text x="600" y="270" text-anchor="middle" font-size="340" class="ae">æ</text>

  <!-- Top Badge: SYNK / SUPERNOVA PROTOCOL -->
  <g transform="translate(600, 75)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="url(#pillGrad)" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.2"/>
    <text x="0" y="5" text-anchor="middle" class="meta">SYNK PROTOCOL // 100%</text>
  </g>

  <!-- Main Headline Title -->
  <text x="600" y="165" text-anchor="middle" font-size="52" class="title" filter="url(#glow)">AK-LMN // SUPERNOVA</text>

  <!-- Subtitle -->
  <text x="600" y="210" text-anchor="middle" class="subtitle">FULL-STACK ENGINEER  ·  OPEN-SOURCE CONTRIBUTOR  ·  BUILDER</text>

  <!-- Metric Pills Row -->
  <g transform="translate(600, 275)">
    <!-- Pill 1: TDK Global Rank #2 -->
    <g transform="translate(-240, 0)">
      <rect x="-105" y="-18" width="210" height="36" rx="8" fill="#0d1117" stroke="#8b5cf6" stroke-width="1.4"/>
      <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#c084fc">TDK GLOBAL #2</text>
    </g>

    <!-- Pill 2: 90+ Open Source Merges -->
    <g transform="translate(0, 0)">
      <rect x="-105" y="-18" width="210" height="36" rx="8" fill="#0d1117" stroke="#06b6d4" stroke-width="1.4"/>
      <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#22d3ee">90+ MERGED PRS</text>
    </g>

    <!-- Pill 3: Flagship LibriQ -->
    <g transform="translate(240, 0)">
      <rect x="-105" y="-18" width="210" height="36" rx="8" fill="#0d1117" stroke="#ec4899" stroke-width="1.4"/>
      <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#f472b6">CREATOR OF LIBRIQ</text>
    </g>
  </g>

  <!-- Bottom Accent Gradient Border Line -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#borderGrad)"/>
</svg>
